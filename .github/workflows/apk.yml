name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # NOTE: the action's default package list ("tools") no longer exists in the
      # current SDK repository, so the packages are installed explicitly below.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android platform 36 and build-tools
        run: |
          # new SDK CLI uses "platforms/android-36", older ones "platforms;android-36"
          sdkmanager "platforms/android-36" "build-tools/36.0.0" \
            || sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle') }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}

      - run: npm ci

      - name: Build the web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Assemble APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cashtracker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # On a v* tag the debug APK and the single-file web app are attached to
      # the GitHub release. The signed release build (npm run release) is done
      # locally so the upload key never has to live in GitHub.
      - name: Attach artefacts to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            dist/cashtracker.html
          body: |
            Cash Tracker ${{ github.ref_name }}

            * `cashtracker-debug.apk` – install with `adb install -r cashtracker-debug.apk`
              or copy it to the phone and open it (allow "install unknown apps").
            * `cashtracker.html` – the whole app in one file. Open it in any
              browser, or serve it for offline use with a service worker.

            The signed release for Google Play is built locally with
            `npm run release -- --versionCode N --versionName X.Y.Z`
            so the upload key stays out of GitHub.
