name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle') }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}

      - run: npm ci

      - name: Build the web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Assemble APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cashtracker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # On a v* tag the debug APK is attached to the GitHub release.
      # The signed release build (npm run release) is done locally so the
      # upload key never has to live in GitHub.
      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            Cash Tracker ${{ github.ref_name }} (debug build)

            Install: `adb install -r cashtracker-debug.apk`
            Or copy the APK to the phone and open it (allow "install unknown apps").

            The signed release for Google Play is built locally with
            `npm run release -- --versionCode N --versionName X.Y.Z`
            so the upload key stays out of GitHub.
