<script>
/* PWA support – only when served over http(s) and not inside the native app. */
(function () {
  if (window.Capacitor) return;                        // native shell
  if (!/^https?:$/.test(location.protocol)) return;    // opened from a file
  var link = document.createElement('link');
  link.rel = 'manifest';
  link.href = './manifest.webmanifest';
  document.head.appendChild(link);
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () { });
    });
  }
})();
</script>

<script>
/* Capacitor shim: exposes the native SaveFile plugin under the name the app expects.
   Capacitor injects its JS bridge asynchronously, so we wait for the plugin to
   actually be available before exposing window.AndroidBridge. */
(function () {
  function nativePlugin() {
    return (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AndroidBridge) || null;
  }
  function pluginReady() {
    try {
      return !!(window.Capacitor && window.Capacitor.isPluginAvailable &&
                window.Capacitor.isPluginAvailable('AndroidBridge'));
    } catch (e) { return false; }
  }
  function install() {
    if (window.__ctBridgeInstalled) return true;
    if (!pluginReady()) return false;
    window.__ctBridgeInstalled = true;
    window.AndroidBridge = {
      saveFile: function (name, mime, base64) {
        return nativePlugin().saveFile({ name: name, mime: mime, base64: base64 });
      }
    };
    document.dispatchEvent(new Event('ct-bridge-ready'));
    return true;
  }
  if (!install()) {
    document.addEventListener('deviceready', install);
    window.addEventListener('load', install);
    var tries = 0;
    var iv = setInterval(function () {
      if (install() || ++tries > 150) clearInterval(iv);
    }, 100);
  }
})();
</script>
